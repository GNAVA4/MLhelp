<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Блок 3 · Итоговый тест</title>
<style>
:root{
  --grn:#16a34a;--grn-l:#f0fdf4;--grn-b:#86efac;
  --red:#dc2626;--red-l:#fef2f2;--red-b:#fca5a5;
  --blue:#2563eb;--blue-l:#eff6ff;--blue-b:#bfdbfe;
  --amber:#d97706;--amber-l:#fffbeb;--amber-b:#fcd34d;
  --pur:#7c3aed;--pur-l:#f5f3ff;--pur-b:#ddd6fe;
  --teal:#0d9488;--teal-l:#f0fdfa;--teal-b:#99f6e4;
  --org:#ea580c;
  --border:#e5e7eb;--bg:#f9fafb;--text:#111827;--text2:#374151;--gray:#6b7280;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
/* Header */
.ph{background:linear-gradient(135deg,#1e1b4b,#4338ca,#064e3b);color:#fff;padding:32px 32px 26px;text-align:center;}
.ph .bc{font-size:11px;opacity:.6;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
.ph h1{font-size:28px;font-weight:800;margin-bottom:8px;}
.ph .sub{font-size:14px;opacity:.8;}
/* Progress bar */
.progbar-wrap{background:#1e293b;padding:16px 32px;}
.pb-label{display:flex;justify-content:space-between;font-size:12px;color:#94a3b8;margin-bottom:6px;}
.pb-outer{background:#334155;border-radius:99px;height:8px;overflow:hidden;}
.pb-inner{background:linear-gradient(90deg,#16a34a,#22d3ee);height:8px;border-radius:99px;width:0%;transition:width .4s;}
/* Topics filter */
.topic-tabs{display:flex;flex-wrap:wrap;gap:6px;padding:18px 24px;background:#fff;border-bottom:1px solid var(--border);}
.ttab{padding:5px 14px;border-radius:99px;border:2px solid var(--border);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;color:var(--gray);}
.ttab.active{color:#fff;}
.ttab.t1.active{background:var(--org);border-color:var(--org);}
.ttab.t2.active{background:var(--blue);border-color:var(--blue);}
.ttab.t3.active{background:var(--red);border-color:var(--red);}
.ttab.t4.active{background:var(--grn);border-color:var(--grn);}
.ttab.all.active{background:#1e293b;border-color:#1e293b;}
/* Main */
.main{max-width:860px;margin:0 auto;padding:28px 20px 80px;}
/* Question card */
.qcard{background:#fff;border:2px solid var(--border);border-radius:14px;padding:22px;margin-bottom:16px;transition:border-color .2s;position:relative;overflow:hidden;}
.qcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;}
.qcard.t1::before{background:var(--org);}
.qcard.t2::before{background:var(--blue);}
.qcard.t3::before{background:var(--red);}
.qcard.t4::before{background:var(--grn);}
.qcard.answered.correct{border-color:var(--grn);background:var(--grn-l);}
.qcard.answered.wrong{border-color:var(--red);background:var(--red-l);}
.qhdr{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;}
.qnum{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;flex-shrink:0;margin-top:2px;}
.t1 .qnum{background:#fff7ed;color:var(--org);}
.t2 .qnum{background:var(--blue-l);color:var(--blue);}
.t3 .qnum{background:var(--red-l);color:var(--red);}
.t4 .qnum{background:var(--grn-l);color:var(--grn);}
.qtopictag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;flex-shrink:0;margin-top:4px;opacity:.7;}
.t1 .qtopictag{background:#fff7ed;color:var(--org);}
.t2 .qtopictag{background:var(--blue-l);color:var(--blue);}
.t3 .qtopictag{background:var(--red-l);color:var(--red);}
.t4 .qtopictag{background:var(--grn-l);color:var(--grn);}
.qtext{font-size:15px;font-weight:600;line-height:1.55;color:var(--text);}
.opts{display:flex;flex-direction:column;gap:7px;}
.opt{display:flex;align-items:flex-start;gap:10px;padding:9px 13px;border:1.5px solid var(--border);border-radius:9px;cursor:pointer;font-size:14px;color:var(--text2);transition:all .15s;line-height:1.5;}
.opt:hover:not(.disabled){background:#f8fafc;border-color:#94a3b8;}
.opt.disabled{cursor:default;}
.opt-key{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;transition:all .2s;}
.opt.selected .opt-key{background:#1e293b;border-color:#1e293b;color:#fff;}
.opt.correct .opt-key{background:var(--grn);border-color:var(--grn);color:#fff;}
.opt.wrong .opt-key{background:var(--red);border-color:var(--red);color:#fff;}
.opt.correct{border-color:var(--grn);background:var(--grn-l);}
.opt.wrong{border-color:var(--red);background:var(--red-l);}
.opt.missed{border-color:var(--grn);border-style:dashed;}
.explain{display:none;margin-top:12px;padding:13px 15px;border-radius:9px;font-size:13.5px;line-height:1.7;border-left:4px solid var(--grn);background:var(--grn-l);color:#14532d;}
.explain.wrong{border-left-color:var(--red);background:var(--red-l);color:#7f1d1d;}
.explain.show{display:block;}
/* Score panel */
.score-panel{position:sticky;bottom:0;background:#fff;border-top:2px solid var(--border);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;z-index:10;}
.score-num{font-size:28px;font-weight:800;color:var(--grn);}
.score-frac{font-size:13px;color:var(--gray);}
.score-breakdown{display:flex;gap:12px;}
.scb{text-align:center;}
.scb-n{font-size:16px;font-weight:700;}
.scb-l{font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:.06em;}
.btns-row{display:flex;gap:8px;}
.btn{padding:9px 18px;border-radius:9px;font-size:13px;font-weight:700;border:none;cursor:pointer;transition:all .15s;}
.btn-reset{background:#f1f5f9;color:#475569;}
.btn-reset:hover{background:#e2e8f0;}
.btn-nav{background:var(--grn);color:#fff;}
.btn-nav:hover{background:#15803d;}
.btn-nav.prev{background:#fff;color:var(--grn);border:2px solid var(--grn);}
/* Result overlay */
.result-overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);align-items:center;justify-content:center;}
.result-overlay.show{display:flex;}
.result-box{background:#fff;border-radius:20px;padding:36px 44px;text-align:center;max-width:440px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.result-emoji{font-size:52px;margin-bottom:12px;}
.result-title{font-size:24px;font-weight:800;margin-bottom:8px;}
.result-score{font-size:48px;font-weight:900;color:var(--grn);margin:12px 0;}
.result-sub{font-size:14px;color:var(--gray);margin-bottom:20px;}
.topic-scores{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0;}
.ts-item{border-radius:9px;padding:10px;text-align:left;}
.ts-item span{display:block;}
.ts-item .ts-l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;}
.ts-item .ts-n{font-size:18px;font-weight:800;}
.result-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
@media(max-width:600px){.main{padding:16px 12px 60px;} .score-panel{padding:10px 14px;} .result-box{padding:24px 20px;}}
</style>
</head>
<body>

<div class="ph">
  <div class="bc">⚡ Блок 3 · Applied ML Cases</div>
  <h1>🏆 Итоговый тест</h1>

<script>
const QUESTIONS = [
// ─── DYNAMIC PRICING (t1) ───────────────────────────────────────────────────
{id:1, t:'t1', tag:'Dynamic Pricing',
  q:'Эластичность спроса ε = −2.5. Что это значит?',
  opts:['При росте цены на 1% — спрос падает на 2.5%','При росте цены на 2.5% — спрос растёт','Эластичный спрос: |ε| > 1 → снижение цены выгодно','Верны A и C'],
  ans:3,
  ex:'|ε| = 2.5 > 1 → эластичный спрос. При росте цены на 1% — спрос падает на 2.5%. При снижении цены → выручка растёт. Обе интерпретации A и C верны.'},

{id:2, t:'t1', tag:'Dynamic Pricing',
  q:'При какой эластичности выручка максимальна (унитарная эластичность)?',
  opts:['ε = 0','ε = −0.5','ε = −1','ε = −∞'],
  ans:2,
  ex:'ε = −1 (унитарная эластичность): MR = 0. Выручка максимальна — ни снижение, ни повышение цены не даст выгоды. При |ε| < 1 (неэластичный) → надо поднимать цену. При |ε| > 1 → снижать.'},

{id:3, t:'t1', tag:'Dynamic Pricing',
  q:'Индекс Лернера: P = 10, MC = 6. Чему равен L?',
  opts:['0.2','0.4','0.6','0.67'],
  ans:1,
  ex:'L = (P − MC) / P = (10 − 6) / 10 = 4/10 = 0.4. Индекс Лернера показывает рыночную власть: 0 = конкуренция, 1 = монополия. L = 0.4 означает умеренную рыночную силу.'},

{id:4, t:'t1', tag:'Dynamic Pricing',
  q:'Оптимальная цена по правилу Рэмси-Лернера: ε = −2, MC = 5₽. Чему равно P*?',
  opts:['7.5₽','10₽','8₽','12₽'],
  ans:1,
  ex:'P* = MC × ε/(ε+1) = 5 × (−2)/(−2+1) = 5 × (−2)/(−1) = 5 × 2 = 10₽. Проверка: L = (10−5)/10 = 0.5 = 1/|ε| = 1/2 = 0.5 ✓.'},

{id:5, t:'t1', tag:'Dynamic Pricing',
  q:'UCB1: что такое "exploration bonus" и зачем он нужен?',
  opts:['Штраф за недоисследованные рычаги, чтобы никогда не эксплуатировать лучший','Бонус √(2 ln t / n_a) — поощряет пробовать редко выбираемые рычаги','Случайный шум для рандомизации','Коэффициент обесценивания старых наград'],
  ans:1,
  ex:'UCB1: a_t = argmax[μ̂_a + √(2 ln t / n_a)]. Exploration bonus √(2 ln t / n_a) → растёт при малом n_a (редко выбирали) и растущем t. Гарантирует что любой рычаг будет исследован достаточно. Это баланс exploitation (μ̂_a) и exploration (bonus).'},

{id:6, t:'t1', tag:'Dynamic Pricing',
  q:'Thompson Sampling vs UCB1: в чём ключевое отличие?',
  opts:['Thompson Sampling быстрее сходится всегда','Thompson Sampling использует байесовский апостериорный семплинг (Beta-binomial), UCB1 — детерминированный верхний доверительный интервал','UCB1 работает только с нормальным распределением','Thompson Sampling хуже при нестационарных средах'],
  ans:1,
  ex:'UCB1: детерминированно выбирает argmax[μ̂ + √(2 ln t / n_a)]. Thompson Sampling: сэмплирует θ_a ~ Beta(α_a, β_a) и выбирает argmax(θ_a). TS — байесовский, естественно учитывает неопределённость через распределение. На практике TS часто лучше UCB1, особенно в cold-start.'},

{id:7, t:'t1', tag:'Dynamic Pricing',
  q:'Regret в контексте Multi-Armed Bandit — это:',
  opts:['Ошибка предсказания conversion rate','Суммарные потери из-за выбора не-оптимальных рычагов: R(T) = T·μ* − Σ μ_{a_t}','Стандартное отклонение наград','Разница в MAE между моделями'],
  ans:1,
  ex:'Regret = разница между идеальной стратегией (всегда выбирать лучший рычаг μ*) и реальной. R(T) = T·μ* − Σ μ_{a_t}. UCB1 и Thompson Sampling: O(log T) regret — sublinear. A/B тест: O(T) regret — linear (весь период держим плохие варианты).'},

{id:8, t:'t1', tag:'Dynamic Pricing',
  q:'Uber Surge Pricing: какая сетка используется для геопространственных зон?',
  opts:['S2 клетки Google','H3 гексагональная сетка Uber','Quadtree деление','PostGIS полигоны'],
  ans:1,
  ex:'Uber использует H3 (Hexagonal Hierarchical Spatial Index) — гексагональную сетку. Преимущества: равное расстояние до всех соседей (у шестиугольника), эффективный spatial join, 16 уровней разрешения. Surge = f(D/S ratio в H3 ячейке × время × историческая эластичность).'},

{id:9, t:'t1', tag:'Dynamic Pricing',
  q:'Price ladder: у цен 100₽/200₽/300₽ → Revenue 3000/4000/2100₽. Что означает Revenue при 300₽?',
  opts:['Неэластичный участок: повышать цену дальше','Эластичный участок: цена уже слишком высокая, спрос упал сильнее чем вырос ценник','Унитарная эластичность','Проблема с моделью'],
  ans:1,
  ex:'Revenue = P × Q. При 200→300₽ (рост на 50%): Revenue упала с 4000 до 2100₽. Значит спрос упал больше чем вырос ценник → |ε| > 1 (эластичный спрос). Оптимум около 200₽. Надо снижать цену или остаться на 200₽.'},

{id:10, t:'t1', tag:'Dynamic Pricing',
  q:'Amazon делает ~2.5 миллиона изменений цен каждые 10 минут. Как они это обосновывают?',
  opts:['Случайное A/B тестирование','Конкурентный ценовой мониторинг + demand signals + portfolio pricing (эффект на другие SKU)','Только сезонность','Ручная настройка команды pricing'],
  ans:1,
  ex:'Amazon: конкурентный мониторинг цен (scraping), сигналы спроса (просмотры, wish lists, cart adds), inventory levels, время суток, сезонность. Portfolio pricing: снизить цену на принтер → стимулировать продажи чернил. Полностью автоматизировано через ML pipeline.'},

{id:11, t:'t1', tag:'Dynamic Pricing',
  q:'Contextual Bandit отличается от обычного MAB тем, что:',
  opts:['Использует градиентный спуск вместо семплинга','Учитывает контекст (фичи пользователя/среды) при выборе action','Оптимизирует ARPU вместо CR','Работает только с дискретными ценами'],
  ans:1,
  ex:'MAB: выбирает рычаг на основе только прошлых наград. Contextual Bandit: a_t = argmax_a E[r|x_t, a] — учитывает контекст x_t (время суток, тип пользователя, устройство и т.д.). LinUCB, NeuralUCB — примеры алгоритмов. Uber, Airbnb используют контекстуальные бандиты для ценовых экспериментов.'},

// ─── DEMAND FORECASTING (t2) ─────────────────────────────────────────────────
{id:12, t:'t2', tag:'Demand Forecasting',
  q:'MAPE не работает корректно если...',
  opts:['Значения целевой переменной близки к нулю (division by zero)','Данных меньше 1000 записей','Использовать LightGBM вместо Prophet','Есть сезонность'],
  ans:0,
  ex:'MAPE = mean(|y - ŷ| / |y|). При y → 0: деление на ноль или бесконечно большие значения. Например y=0.1, ŷ=1 → MAPE = 900%. Альтернативы при нулях: SMAPE, sMAPE, RMSSE, MAE.'},

{id:13, t:'t2', tag:'Demand Forecasting',
  q:'WRMSSE в M5 Challenge: что означает "W" (weighted)?',
  opts:['Взвешенная по количеству наблюдений','Взвешенная по выручке каждой серии (dollar-weighted)','Взвешенная по иерархическому уровню','Взвешенная по сезонности'],
  ans:1,
  ex:'WRMSSE = Σ_i w_i · RMSSE_i, где w_i = (revenue_i / Σ revenue) — доля выручки каждой серии. Ошибки на дорогих/популярных товарах штрафуются сильнее. M5 winner WRMSSE = 0.527 (LightGBM, 28 direct models).'},

{id:14, t:'t2', tag:'Demand Forecasting',
  q:'Hierarchical forecasting: что такое Bottom-Up подход?',
  opts:['Прогноз делается на верхнем уровне, потом disaggregation вниз','Прогноз на каждом листовом уровне, суммирование вверх','Прогноз на среднем уровне, потом вверх и вниз','Оптимальное согласование через матрицу'],
  ans:1,
  ex:'Bottom-Up: прогнозируем каждую листовую серию (SKU×Store), суммируем вверх для получения агрегатов. Плюс: точные базовые прогнозы. Минус: нет знаний об агрегированных паттернах, ошибки накапливаются вверх.'},

{id:15, t:'t2', tag:'Demand Forecasting',
  q:'MinT (Minimum Trace) reconciliation лучше Bottom-Up потому что:',
  opts:['Всегда быстрее вычисляется','Минимизирует суммарную дисперсию прогнозов с учётом ковариационной структуры','Не требует прогнозов на каждом уровне','Работает только для 2-уровневой иерархии'],
  ans:1,
  ex:'MinT: ỹ_h = S(S^T W_h^{-1} S)^{-1} S^T W_h^{-1} ŷ_h. Оптимально согласует прогнозы всех уровней минимизируя trace ковариационной матрицы ошибок. Учитывает корреляции между сериями. Превосходит Bottom-Up и Top-Down на большинстве датасетов.'},

{id:16, t:'t2', tag:'Demand Forecasting',
  q:'Temporal leakage через rolling mean: почему df["avg_7d"] = df["sales"].rolling(7).mean() — ОШИБКА?',
  opts:['rolling() медленнее чем groupby','Включает текущий день в окно → информация из будущего просачивается в обучение','rolling(7) даёт слишком маленькое окно','Нужно использовать ewm вместо rolling'],
  ans:1,
  ex:'rolling(7) на строке t включает значения t, t-1, ..., t-6 — включая текущий день t. Цель тоже sales[t] → leakage. Правильно: .rolling(7).mean().shift(1) — окно заканчивается на t-1, не включает текущий момент.'},

{id:17, t:'t2', tag:'Demand Forecasting',
  q:'TimeSeriesSplit vs обычный KFold для временных рядов: почему KFold неверен?',
  opts:['KFold медленнее','KFold смешивает прошлое и будущее: модель обучается на будущих данных, предсказывает прошлые → нереалистично','KFold работает только для классификации','KFold не поддерживает временные признаки'],
  ans:1,
  ex:'KFold: fold может взять training=данные с t>1000 и validation=t<500. Модель "видит будущее" на обучении. TimeSeriesSplit всегда: train=[0..k], val=[k+1..m]. Иначе метрики оптимистично завышены, модель на production хуже чем в CV.'},

{id:18, t:'t2', tag:'Demand Forecasting',
  q:'Prophet: формула модели y(t) = g(t) + s(t) + h(t) + ε. Что такое s(t)?',
  opts:['Общий тренд (линейный или логистический)','Сезонная компонента через ряды Фурье','Эффект праздников и событий','Остаток (шум)'],
  ans:1,
  ex:'g(t) — тренд (линейный или насыщающийся логистический). s(t) — seasonality через Фурье ряды: s(t) = Σ_n [a_n cos(2πnt/P) + b_n sin(2πnt/P)]. h(t) — holidays (индикаторные переменные). ε_t — ошибка.'},

{id:19, t:'t2', tag:'Demand Forecasting',
  q:'N-BEATS: что такое "doubly residual stacking"?',
  opts:['Два отдельных слоя нормализации','Каждый блок предсказывает backcast (объяснение входа) и forecast, вычитая backcast из входа перед следующим блоком','Skip connections как в ResNet','Двойной dropout для регуляризации'],
  ans:1,
  ex:'N-BEATS: блок_k → backcast_k (объясняет входной сигнал) + forecast_k (вклад в прогноз). Вход для блок_{k+1} = вход_k − backcast_k. Doubly residual: 1) вычитаем backcast из входа (residual stack), 2) суммируем forecasts (residual block). Позволяет интерпретировать тренд и сезонность через отдельные стеки.'},

{id:20, t:'t2', tag:'Demand Forecasting',
  q:'Почему LightGBM выиграл M5 Challenge (WRMSSE=0.527) а не чистые DL модели?',
  opts:['DL модели были запрещены','LightGBM хорошо работает с табличными данными + ручное feature engineering + 28 прямых моделей (по 1 на каждый horion)','Prophet дал аналогичный результат','Random Forest показал лучшие результаты'],
  ans:1,
  ex:'M5 winner (Walmart): LightGBM, 28 direct models (один на каждый из 28 дней горизонта). Мощное feature engineering: lag_1/7/28, rolling_mean_7/28/90 с shift(1), calendar features (SNAP дни, мероприятия), price ratio. DL модели требуют много данных, плохо масштабируются на 42k серий, хуже захватывают irregular events.'},

{id:21, t:'t2', tag:'Demand Forecasting',
  q:'Pinball loss для квантильного прогноза: зачем несимметричная штрафная функция?',
  opts:['Для ускорения градиентного спуска','Асимметрия позволяет по-разному штрафовать переоценку и недооценку — критично для inventory (недостаток товара дороже излишка или наоборот)','Pinball loss выпуклая, MAE нет','Позволяет предсказывать несколько квантилей одновременно'],
  ans:1,
  ex:'Pinball_τ(y, ŷ) = τ·max(y−ŷ, 0) + (1−τ)·max(ŷ−y, 0). При τ=0.9: переоценка (ŷ>y) штрафуется слабее чем недооценка (ŷ<y) → оптимизирует 90-й квантиль. Для inventory: stockout (недостаток) обходится дороже → τ=0.95 лучше чем τ=0.5.'},

{id:22, t:'t2', tag:'Demand Forecasting',
  q:'Walmart M5 Challenge: сколько временных рядов и какая иерархия?',
  opts:['10,000 серий, 5 уровней','42,840 серий (30,490 SKU×Store + агрегаты), 12 уровней иерархии','100,000 серий, 3 уровня','5,000 серий, 7 уровней'],
  ans:1,
  ex:'M5: 3 штата (CA, TX, WI) × 10 магазинов × 7 категорий × 3 dept × 3,049 продуктов = 30,490 leaf серий. С агрегатами всех уровней: 42,840 серий. 12 уровней иерархии: Total → State → Store → Category → Department → Item × State/Store. Горизонт: 28 дней (4 недели).'},

// ─── FRAUD DETECTION (t3) ────────────────────────────────────────────────────
{id:23, t:'t3', tag:'Fraud Detection',
  q:'Precision = 0.95, Recall = 0.60 для fraud detector. Что это означает?',
  opts:['95% верно найденных фродов, но пропускаем 40% реального фрода','60% верно найденных фродов, 5% ложных тревог','Хорошая модель — оба значения высокие','Нужно использовать Accuracy вместо'],
  ans:0,
  ex:'Precision = TP/(TP+FP) = 95% → из всего что назвали fraud, 95% — реальный. Recall = TP/(TP+FN) = 60% → из всего реального фрода находим 60%, пропускаем 40% (FN). Для fraud detection критичен высокий Recall: пропущенный фрод = убыток для банка. Нужно снизить threshold.'},

{id:24, t:'t3', tag:'Fraud Detection',
  q:'F-beta с β=2 для fraud detection. Что означает β=2?',
  opts:['Вес Recall вдвое больше чем Precision (Recall важнее)','Вес Precision вдвое больше чем Recall','β контролирует learning rate','β=2 означает балансировку классов'],
  ans:0,
  ex:'F_β = (1+β²)·PR / (β²·P + R). При β=2: β²=4. Recall получает вес 4/(4+1)=80%, Precision — 20%. Смысл: пропустить реальный фрод (FN) в 4 раза хуже чем ложная тревога (FP). Соответствует реальной стоимости ошибок: FN = потеря транзакции, FP = неудобство клиента.'},

{id:25, t:'t3', tag:'Fraud Detection',
  q:'Почему PR-AUC лучше ROC-AUC при экстремальном дисбалансе классов (0.1% fraud)?',
  opts:['PR-AUC быстрее вычисляется','ROC-AUC оптимистичен из-за большого TN: даже плохая модель имеет ROC-AUC ≈ 0.99. PR-AUC чувствительна к качеству предсказания для minority класса','PR-AUC не зависит от threshold','PR-AUC работает только с бинарной классификацией'],
  ans:1,
  ex:'ROC-AUC: TPR vs FPR. При 0.1% фрода: FPR = FP/(FP+TN). TN огромный → FPR маленький → ROC-AUC ≈ 0.99 даже для плохих моделей. PR-AUC: Precision vs Recall — оба зависят только от TP, FP, FN. Baseline PR-AUC = fraction of positives = 0.001. Хорошая модель: PR-AUC >> 0.001.'},

{id:26, t:'t3', tag:'Fraud Detection',
  q:'Focal Loss: зачем (1−p_t)^γ в формуле FL = −α_t(1−p_t)^γ log(p_t)?',
  opts:['Для нормализации градиентов','Downweights easy examples (легко классифицированные образцы): если p_t → 1 то (1−p_t)^γ → 0. Hard examples получают больший вес','Для ускорения обучения','Для работы с несбалансированными батчами'],
  ans:1,
  ex:'Стандартный CE: −log(p_t) — одинаково штрафует все примеры. При дисбалансе: большинство "лёгких" негативов доминируют градиент. Focal: (1−p_t)^γ ≈ 0 когда модель уверена (p_t высокий). Только "трудные" примеры (p_t низкий) получают полный вес. γ=2: типичное значение. Разработан Facebook для object detection (RetinaNet), применяется в fraud.'},

{id:27, t:'t3', tag:'Fraud Detection',
  q:'Velocity features: какие агрегаты нужны для детекции "кардинга" (серия мелких транзакций)?',
  opts:['Только сумма транзакций за 30 дней','count_1h (число транзакций за 1 час), unique_merchants_1h, sum_1h — краткосрочные velocity окна','Средний чек за всё время','Географические признаки'],
  ans:1,
  ex:'Кардинг: мошенник проверяет украденные карты серией мелких транзакций (~$1 каждая). Сигнал: 10+ транзакций за 1 час, разные мерчанты, маленькие суммы. Velocity features: count_1h, unique_merchants_1h, count_since_last_big_txn. При нормальном использовании: 1-2 транзакции в час, не 10+.'},

{id:28, t:'t3', tag:'Fraud Detection',
  q:'Feature Store: что такое "train-serve skew" и как его избежать?',
  opts:['Разные алгоритмы обучения и инференса','Фичи в обучении вычислены иначе чем в продакшне: разные временные окна, утечки данных, разный preprocessing → модель деградирует. Решение: единая feature pipeline','Разные threshold на train и serve','Разные версии Python'],
  ans:1,
  ex:'Train-serve skew: самая частая причина деградации ML в production. Например: в обучении rolling_mean_7d включает текущий день (leakage), в production — нет. Или в обучении использовали данные которых нет в real-time. Решение: Feature Store с единой логикой, point-in-time correct joins, feature logging + comparison.'},

{id:29, t:'t3', tag:'Fraud Detection',
  q:'PSI (Population Stability Index) = 0.25. Что это означает?',
  opts:['Модель стабильна, изменений нет','0.1 < PSI < 0.2 → умеренный сдвиг. PSI > 0.2 → значительный сдвиг, нужен реtraining','Нормальное значение, всё хорошо','PSI не применим для фрод-моделей'],
  ans:1,
  ex:'PSI = Σ(E_i − A_i)·ln(E_i/A_i). Интерпретация: PSI < 0.1 → стабильно. 0.1 < PSI < 0.2 → умеренный сдвиг, мониторинг. PSI > 0.2 → значительный концептуальный дрейф, требуется анализ и скорее всего retraining. PSI=0.25 → нужно переобучать модель.'},

{id:30, t:'t3', tag:'Fraud Detection',
  q:'Stripe Radar pipeline: правильный порядок обработки транзакции?',
  opts:['LGBM → Rule Engine → Feature Store → Decision','Rule Engine → Feature Store → LGBM ONNX → Decision Engine → 3DS Step-up','Feature Store → LGBM → Rule Engine → 3DS','3DS → Rule Engine → LGBM → Feature Store'],
  ans:1,
  ex:'1. Rule Engine: детерминированные правила (blocked countries, known BINs). 2. Feature Store (Redis): real-time velocity features <5ms. 3. LGBM ONNX: inference <10ms. 4. Decision Engine: threshold + business rules. 5. 3DS Step-up: для пограничных случаев (0.3-0.7 score) → дополнительная аутентификация. Весь pipeline: <50ms.'},

{id:31, t:'t3', tag:'Fraud Detection',
  q:'Graph ML для fraud detection: что такое synthetic identity fraud?',
  opts:['Фрод через синтетические изображения','Создание фиктивных личностей из комбинации реальных данных разных людей. GNN эффективна т.к. выявляет связи между аккаунтами использующими одни и те же email/phone/address','Автоматически генерированные транзакции','Deepfake видео для верификации'],
  ans:1,
  ex:'Synthetic identity fraud: мошенник берёт SSN ребёнка, имя из одного источника, адрес из другого → создаёт "нового" человека. Transactional ML: не замечает — история чистая. Graph ML: аккаунт шарит email с 3 другими аккаунтами, шарит phone с 5 → подозрительный кластер. GraphSAGE / GAT обнаруживают эти связи. FB, PayPal, Stripe используют GNN.'},

{id:32, t:'t3', tag:'Fraud Detection',
  q:'Как cost-based threshold optimization работает лучше обычного 0.5?',
  opts:['Снижает вычислительную стоимость','Выбирает threshold минимизирующий бизнес-стоимость: Cost = FN_cost × FN + FP_cost × FP. При FN_cost >> FP_cost → сдвигаем threshold вниз (ловим больше фрода, больше ложных тревог)','Автоматически балансирует классы','Работает только с XGBoost'],
  ans:1,
  ex:'Cost = 50×FN + 5×FP (пример: пропущенный фрод в 10× дороже ложной тревоги). Перебираем threshold [0, 0.01, ..., 1.0], вычисляем Cost = 50×FN + 5×FP для каждого. Выбираем threshold с минимальным Cost. Это может быть 0.2 или 0.35, а не стандартное 0.5.'},

// ─── LTV PREDICTION (t4) ─────────────────────────────────────────────────────
{id:33, t:'t4', tag:'LTV Prediction',
  q:'BG/NBD использует только... как входные данные?',
  opts:['Демографию клиента и канал привлечения','RFM: Frequency (число покупок), Recency (время последней покупки), T (длина периода наблюдения)','Последовательность транзакций полностью','Email engagement и поведение на сайте'],
  ans:1,
  ex:'BG/NBD: только (x, t_x, T). x = frequency (число повторных покупок). t_x = recency (время последней покупки от старта). T = длина наблюдаемого периода. Это очень компактное представление — вся история сжата в 3 числа. Мощь модели в вероятностных предположениях, не в количестве признаков.'},

{id:34, t:'t4', tag:'LTV Prediction',
  q:'Клиент: x=0 покупок, T=52 нед. Что предсказывает BG/NBD?',
  opts:['Ошибка модели — нельзя применять без покупок','Очень низкая P(alive): клиент скорее всего "умер" (не вернётся). E[покупок] → ~0','Высокая P(alive): нулевые покупки нормальны','P(alive) = 0.5 по умолчанию'],
  ans:1,
  ex:'x=0 за весь год: либо клиент никогда не совершил покупку (зарегистрировался но не купил) или "умер" сразу. P(alive) будет очень низкой, E[покупок] близко к 0. BG/NBD: P(alive|x=0, T=52) = P(ещё не купил, но живой) / P(всё наблюдение). При λ~0.05/нед за 52 нед → E[покупок | живой] = 2.6. Ноль покупок при ожидаемых 2.6 → очень маловероятно что живой.'},

{id:35, t:'t4', tag:'LTV Prediction',
  q:'Формула CLV с дисконтированием при постоянных m=500₽, r=0.9, d=0.05. Чему равен CLV?',
  opts:['500₽','3,000₽','3,000₽ (точнее: 500 × 0.9/0.15 = 3,000₽)','5,000₽'],
  ans:2,
  ex:'CLV = m × r / (1 + d − r) = 500 × 0.9 / (1.05 − 0.9) = 500 × 0.9 / 0.15 = 500 × 6 = 3,000₽. Intuition: retention 90%, discount 5% → средняя "жизнь" клиента ≈ 10 периодов, но с дисконтом. LTV = ~6 × маржа в один период.'},

{id:36, t:'t4', tag:'LTV Prediction',
  q:'В чём смысл shrinkage в Gamma-Gamma модели?',
  opts:['Регуляризация весов нейронной сети','Оценка среднего чека клиента = взвешенное среднее его истории и популяционного среднего. При малом числе транзакций → сильнее тянемся к популяционному среднему','Сжатие модели для fast inference','Уменьшение batch size'],
  ans:1,
  ex:'E[M | m̄, x] = (p·γ + x·m̄) / (p·γ + x). При x=1: влияние популяционного prior p·γ сильное. При x=100: влияние почти нулевое — верим личной истории. Это Bayesian shrinkage: не доверяем одной наблюдению, усредняем с prior. Классический результат: "один дорогой заказ не делает клиента VIP".'},

{id:37, t:'t4', tag:'LTV Prediction',
  q:'Почему Two-stage LTV модель лучше одной регрессии при 70% нулей?',
  opts:['Two-stage быстрее обучается','Одна регрессия предсказывает среднее CLV ≈ 0.3 × E[value] для всех. Two-stage: Stage 1 отделяет нулей, Stage 2 точно моделирует распределение покупателей','Two-stage не требует feature engineering','Одна регрессия переобучается'],
  ans:1,
  ex:'LTV-распределение: смесь Point mass at 0 (70%) + continuous для покупателей (30%). Одна регрессия: плохо моделирует смесь, высокий RMSE. Two-stage: P(purchase) × E[value|purchase]. Стадия 1: binary classifier. Стадия 2: регрессор только на покупателях. Google использует это для Value-Based Bidding.'},

{id:38, t:'t4', tag:'LTV Prediction',
  q:'LTV/CAC = 0.6 для канала TikTok Ads. Что делать?',
  opts:['Масштабировать канал — высокий ROI','Остановить или резко сократить: тратим больше на привлечение чем получаем обратно','Подождать 12 месяцев и пересчитать','Увеличить CAC для роста качества'],
  ans:1,
  ex:'LTV/CAC < 1 → каждый привлечённый клиент приносит убыток. Тратим 1₽ CAC → получаем 0.6₽ LTV. Правило: LTV/CAC > 3 = здоровый бизнес. 1-3 = инвестиционная фаза. < 1 = убыточно, нужно или снизить CAC или найти клиентов с более высоким LTV в этом канале. TikTok нужно остановить.'},

{id:39, t:'t4', tag:'LTV Prediction',
  q:'Как Spotify использует CLV как North Star Metric?',
  opts:['Считают только подписочную выручку без прогнозов','Adjusted Quality Score = P(convert to Premium) × E[LTV|Premium] для оценки маркетинговых кампаний, заменив MAU','Spotify не использует CLV — только MAU','CLV используется только для B2B клиентов'],
  ans:1,
  ex:'Spotify перешёл от MAU (Monthly Active Users) к "Quality User" метрике на базе CLV. Маркетинговые кампании оцениваются по AQS = P(convert) × E[LTV|Premium]. MAU поощрял дешёвых бесплатных пользователей которые никогда не конвертируются. Результат перехода: premium conversion rate +12%, CAC −18%.'},

{id:40, t:'t4', tag:'LTV Prediction',
  q:'Клиент А: P(churn)=0.9, CLV=5000₽. Клиент Б: P(churn)=0.3, CLV=20000₽. Кому приоритет в retention?',
  opts:['Клиент А — выше вероятность ухода','Клиент Б — retention_priority = 0.3 × 20000 = 6000 >> 0.9 × 5000 = 4500','Одинаковые приоритеты — средние значения','Нужно ещё знать CAC'],
  ans:1,
  ex:'Retention priority = P(churn) × CLV. А: 0.9 × 5000 = 4500₽ expected loss. Б: 0.3 × 20000 = 6000₽ expected loss. Клиент Б важнее несмотря на меньший churn риск — потеря будет дороже. Это ключевое использование CLV: не просто "кто уйдёт" а "кого важнее удержать". Netflix, Spotify именно так приоритизируют retention campaigns.'},

{id:41, t:'t4', tag:'LTV Prediction',
  q:'Как валидировать LTV модель без ожидания реального LTV?',
  opts:['Нельзя — только ждать','Backtesting: обучаемся до T_train, предсказываем на [T_train, T_train+12m], сравниваем с реальными данными этого периода + cohort validation + percentile ranking (Spearman ρ)','Только по PR-AUC','Random train/test split'],
  ans:1,
  ex:'Валидация LTV: 1) Backtesting: train на данных до 12 месяцев назад, validate на последних 12 месяцах. 2) Cohort validation: predicted CLV когорты Q1-2024 vs реальные траты Q1-Q4 2024. 3) Rank correlation: Spearman ρ между predicted ranking и actual ranking. 4) Calibration curve: predicted CLV bucket vs actual mean. 5) Business A/B тест: retention campaign на top-CLV vs random.'},

{id:42, t:'t4', tag:'LTV Prediction',
  q:'Amazon Prime: как CLV объясняет экономику $139/год членства?',
  opts:['Prime убыточен — кросс-субсидирование от AWS','Prime members тратят $1400/год vs $600 non-Prime → +$800/год → дополнительная маржа > CAC. Prime = "бесплатный" CAC-агрегатор для high-LTV клиентов','Prime прибылен только из-за Prime Video рекламы','$139 полностью покрывает стоимость доставки'],
  ans:1,
  ex:'Prime economics: $1400/год vs $600 → разница $800. При марже ~15%: $120/год дополнительной прибыли. Минус $139 членство = небольшой убыток на членстве, но ОГРОМНАЯ выгода на incremental spending. Плюс: бесплатная доставка → высокий retention → higher LTV. Prime = механизм повышения LTV через lock-in и increased frequency. Инженерные команды Amazon: evaluate фичи по incremental CLV.'}

let answers = {};
let currentFilter = 'all';

function render() {
  const container = document.getElementById('quiz-container');
  const filtered = currentFilter === 'all' ? QUESTIONS : QUESTIONS.filter(q => q.t === currentFilter);
  container.innerHTML = filtered.map(q => renderQ(q)).join('');
}

function renderQ(q) {
  const ans = answers[q.id];
  const hasAns = ans !== undefined;
  const topicNames = {t1:'Dynamic Pricing', t2:'Demand Forecasting', t3:'Fraud Detection', t4:'LTV'};
  let extraClass = '';
  if (hasAns) extraClass = ans === q.ans ? ' answered correct' : ' answered wrong';
  return `<div class="qcard ${q.t}${extraClass}" id="qcard-${q.id}">
    <div class="qhdr">
      <div class="qnum">#{id}</div>
      <div class="qtopictag">${q.tag}</div>
      <div class="qtext">${q.q}</div>
    </div>
    <div class="opts">
      ${q.opts.map((o, i) => renderOpt(q, o, i, ans)).join('')}
    </div>
    <div class="explain ${hasAns && ans !== q.ans ? 'wrong' : ''} ${hasAns ? 'show' : ''}">
      <strong>${hasAns && ans === q.ans ? '✅ Верно!' : hasAns ? '❌ Не совсем.' : ''}</strong> ${q.ex}
    </div>
  </div>`.replace('#{id}', `Q${q.id}`);
}

function renderOpt(q, opt, i, ans) {
  const letters = 'ABCD';
  const hasAns = ans !== undefined;
  let cls = '';
  if (hasAns) {
    if (i === q.ans) cls = 'correct';
    else if (i === ans && ans !== q.ans) cls = 'wrong';
  }
  const disabled = hasAns ? 'disabled' : '';
  return `<div class="opt ${cls} ${hasAns ? 'disabled' : ''}" onclick="${hasAns ? '' : `selectOpt(${q.id}, ${i})`}">
    <div class="opt-key">${letters[i]}</div>
    <div>${opt}</div>
  </div>`;
}

function selectOpt(qid, i) {
  answers[qid] = i;
  updateCard(qid);
  updateProgress();
  updateScore();
}

function updateCard(qid) {
  const q = QUESTIONS.find(x => x.id === qid);
  const card = document.getElementById(`qcard-${qid}`);
  if (!card || !q) return;
  const isCorrect = answers[qid] === q.ans;
  card.className = `qcard ${q.t} answered ${isCorrect ? 'correct' : 'wrong'}`;
  const optsEl = card.querySelectorAll('.opt');
  optsEl.forEach((el, i) => {
    el.classList.add('disabled');
    el.onclick = null;
    if (i === q.ans) el.classList.add('correct');
    else if (i === answers[qid] && !isCorrect) el.classList.add('wrong');
  });
  const exEl = card.querySelector('.explain');
  if (exEl) {
    exEl.classList.add('show');
    if (!isCorrect) exEl.classList.add('wrong');
    exEl.innerHTML = `<strong>${isCorrect ? '✅ Верно!' : '❌ Не совсем.'}</strong> ${q.ex}`;
  }
}

function updateProgress() {
  const total = QUESTIONS.length;
  const done = Object.keys(answers).length;
  const pct = Math.round(done / total * 100);
  document.getElementById('pb-text').textContent = `${done} / ${total} ответов`;
  document.getElementById('pb-pct').textContent = `${pct}%`;
  document.getElementById('pb-fill').style.width = `${pct}%`;
}

function updateScore() {
  const answered = Object.keys(answers);
  const correct = answered.filter(id => answers[id] === QUESTIONS.find(q => q.id == id).ans);
  document.getElementById('score-main').textContent = correct.length;
  document.getElementById('score-frac').textContent = `из ${answered.length} отвеченных`;
  const topics = ['t1','t2','t3','t4'];
  const tnames = ['🔶 DP','🔵 DF','🔴 FD','🟢 LTV'];
  const tcolors = ['#ea580c','#2563eb','#dc2626','#16a34a'];
  document.getElementById('breakdown').innerHTML = topics.map((t,i) => {
    const qs = QUESTIONS.filter(q => q.t === t);
    const cr = qs.filter(q => answers[q.id] === q.ans).length;
    const an = qs.filter(q => answers[q.id] !== undefined).length;
    return `<div class="scb"><div class="scb-n" style="color:${tcolors[i]}">${cr}/${an}</div><div class="scb-l">${tnames[i]}</div></div>`;
  }).join('');
}

function filterTopic(t) {
  currentFilter = t;
  document.querySelectorAll('.ttab').forEach(el => el.classList.remove('active'));
  if (t === 'all') document.querySelector('.ttab.all').classList.add('active');
  else document.querySelector(`.ttab.${t}`).classList.add('active');
  render();
  // Restore answered state visually
  Object.keys(answers).forEach(id => { const card = document.getElementById(`qcard-${id}`); if(card) updateCard(parseInt(id)); });
}

function resetAll() {
  answers = {};
  render();
  updateProgress();
  updateScore();
}

function showResult() {
  const total = QUESTIONS.length;
  const correct = QUESTIONS.filter(q => answers[q.id] === q.ans).length;
  const answered = Object.keys(answers).length;
  const pct = Math.round(correct / total * 100);
  const overlay = document.getElementById('result-overlay');
  document.getElementById('r-score').textContent = `${correct}/${total}`;
  let emoji = '🏆', title = 'Отлично!', sub = '';
  if (pct >= 90) { emoji = '🏆'; title = 'Отлично! Senior-level'; sub = 'Готов к production задачам по Applied ML!'; }
  else if (pct >= 75) { emoji = '🎯'; title = 'Хорошо! Mid-level'; sub = 'Крепкая база. Ещё раз пройди слабые топики.'; }
  else if (pct >= 60) { emoji = '📚'; title = 'Неплохо. Junior+'; sub = 'Повтори формулы и численные примеры.'; }
  else { emoji = '💪'; title = 'Нужна практика'; sub = 'Перечитай разделы которые провалил и попробуй снова.'; }
  document.getElementById('r-emoji').textContent = emoji;
  document.getElementById('r-title').textContent = title;
  document.getElementById('r-sub').textContent = sub + ` Отвечено: ${answered}/${total}.`;
  const topics = [
    {t:'t1', name:'Dynamic Pricing', color:'#fff7ed', tc:'#ea580c'},
    {t:'t2', name:'Demand Forecasting', color:'#eff6ff', tc:'#2563eb'},
    {t:'t3', name:'Fraud Detection', color:'#fef2f2', tc:'#dc2626'},
    {t:'t4', name:'LTV Prediction', color:'#f0fdf4', tc:'#16a34a'}
  ];
  document.getElementById('r-topics').innerHTML = topics.map(tp => {
    const qs = QUESTIONS.filter(q => q.t === tp.t);
    const cr = qs.filter(q => answers[q.id] === q.ans).length;
    const an = qs.filter(q => answers[q.id] !== undefined).length;
    return `<div class="ts-item" style="background:${tp.color};">
      <span class="ts-l" style="color:${tp.tc};">${tp.name}</span>
      <span class="ts-n" style="color:${tp.tc};">${cr}/${qs.length} <span style="font-size:12px;font-weight:400;">(${an} отв.)</span></span>
    </div>`;
  }).join('');
  overlay.classList.add('show');
}

function closeResult() {
  document.getElementById('result-overlay').classList.remove('show');
}

// Init
render();
updateProgress();
updateScore();
</script>
</body>
</html>
